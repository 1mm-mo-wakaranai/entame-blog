{{- /* 記事本文の直後に出す広告（忍者アドマックス）。AIブログ・ググワカと同じ配置・出し分け */}}
{{- /* 広告枠IDはAIブログのものを流用中（エンタメ用の枠を作ったら差し替える） */}}
{{ if and .IsPage (eq .Section "posts") }}
<!-- 記事末尾（あわせて読みたいの下）：広告（忍者アドマックス） -->
<div class="ad-after-related">
  <!-- PC: 横長バナー -->
  <div class="admax-pc">
    <!-- admax -->
    <script src="https://adm.shinobi.jp/s/0640521f20009b6fd0a33c5bf2900a8b"></script>
    <!-- admax -->
  </div>
  <!-- スマホ: 小さ目 -->
  <div class="admax-sp">
    <!-- admax -->
    <script src="https://adm.shinobi.jp/s/76c7ebb6ad2ebea3e9c0a712c979b862"></script>
    <!-- admax -->
  </div>
</div>

<!-- 記事中盤に広告をもう1枠自動挿入（H2の区切りに合わせる） -->
<script>
(function () {
  var content = document.querySelector(".post-content");
  if (!content) return;
  var h2s = content.querySelectorAll("h2");
  if (h2s.length < 4) return; // 見出しが少ない記事は追加しない
  var target = h2s[Math.floor(h2s.length / 2)]; // 中盤のH2の直前
  if (!target) return;

  var wrap = document.createElement("div");
  wrap.className = "ad-mid-article ad-mid-auto";

  function makeAdmax(cls, src) {
    var box = document.createElement("div");
    box.className = cls;
    var s = document.createElement("script");
    s.src = src;
    box.appendChild(s);
    return box;
  }
  wrap.appendChild(makeAdmax("admax-pc", "https://adm.shinobi.jp/s/00ad71976e3389d374d84c8473496011"));
  wrap.appendChild(makeAdmax("admax-sp", "https://adm.shinobi.jp/s/2696f195997c96a044d924f68a09eff0"));

  target.parentNode.insertBefore(wrap, target);
})();
</script>
{{ end }}
